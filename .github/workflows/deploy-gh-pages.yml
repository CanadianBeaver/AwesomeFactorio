# Sample workflow for building and deploying a Docusaurus site to GitHub Pages
name: Publish website to GitHub Pages

on:
  #pull_request:
  #  branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: website
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Prepare latest commits from git
        run: |
          mkdir -p website/src/data
          git log -n 20 --pretty=format:'%H|+|%ad|+|%s' --date=format:'%e %B %Y' | \
            grep -vE 'https?://' | \
            head -n 6 > website/src/data/tmp-git-commits.log
          while read LINE; do
            HASH=$(echo "$LINE" | awk -F'\\|\\+\\|' '{print $1}')
            DATE=$(echo "$LINE" | awk -F'\\|\\+\\|' '{print $2}')
            MSG=$(echo "$LINE" | awk -F'\\|\\+\\|' '{print $3}' | sed 's/"/\\"/g')
            echo "{\"date\": \"$DATE\", \"message\": \"$MSG\", \"url\": \"https://github.com/${GITHUB_REPOSITORY}/commit/${HASH}\"}"
          done < website/src/data/tmp-git-commits.log > website/src/data/tmp-git-commits.json
          rm website/src/data/tmp-git-commits.log          
          printf '[%s]\n' "$(paste -sd, - < website/src/data/tmp-git-commits.json)" > website/src/data/git-commits.json
          rm website/src/data/tmp-git-commits.json
      - name: Save latest commits from git for debug
        uses: actions/upload-artifact@v3
        with:
          name: git-commits
          path: website/src/data/git-commits.json
      - name: Build pages
        run: npm run build
        working-directory: website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
