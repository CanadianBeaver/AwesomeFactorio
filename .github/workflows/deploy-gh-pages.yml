# Sample workflow for building and deploying a Docusaurus site to GitHub Pages
name: Publish website to GitHub Pages

on:
  #pull_request:
  #  branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      SHOW_GOOGLE_ADS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: website
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Prepare latest commits from git
        run: |
          mkdir -p website/src/data
          git log -n 30 --pretty=format:'%H@@@%ad@@@%s' --date=format:'%e %B %Y' | \
            awk -F'@@@' '!($3 ~ /^!/ || $3 ~ /https?:\/\//) {
              gsub(/"/, "\\\"", $3);
              print "{\"date\": \"" $2 "\", \"message\": \"" $3 "\", \"url\": \"https://github.com/'"${GITHUB_REPOSITORY}"'/commit/" $1 "\"}"
            }' | \
            head -n 6 | \
            awk 'NR==1{printf "["}{if(NR>1)printf ","} {printf "%s", $0} END{print "]"}' \
            > website/src/data/git-commits.json


      - name: 🛠 Generate git-commits-pages.json
        run: |
          mkdir -p website/src/data
          git log -n 30 --pretty=format:'%H@@@%ad@@@%s' --date=format:'%e %B %Y' | awk -v repo="$GITHUB_REPOSITORY" -F'@@@' '
            function escape(str,s,i,r) {
              s = str; gsub(/\\/,"\\\\", s); gsub(/"/,"\\\"",s)
              gsub(/\t/, "\\t", s); gsub(/\r/, "\\r", s); gsub(/\n/, "\\n", s)
              return s
            }

            BEGIN {
              print "["; first = 1
            }

            {
              sha = $1
              date = $2
              msg = $3

              # Пропускаем коммиты с URL или начинающиеся с !
              if (msg ~ /^!/ || msg ~ /https?:\/\//) next

              # Получить список файлов в коммите
              cmd = "git diff-tree --no-commit-id --name-only -r " sha
              pages = ""; count = 0
              while ((cmd | getline file) > 0) {
                if (file ~ /^docs\/.*\.md$/) {
                  path = file; sub(/^docs\//, "", path); sub(/\.md$/, "", path)
                  url = "https://awesomefactorio.yrfle.com/" path
                  pages = pages "\"" url "\","
                  count++
                } else if (file ~ /^blog\/.*\.md$/) {
                  path = file; sub(/^blog\//, "", path); sub(/\.md$/, "", path)
                  url = "https://awesomefactorio.yrfle.com/blog/" path
                  pages = pages "\"" url "\","
                  count++
                }
              }
              close(cmd)

              if (count == 0) next

              # Удалить последнюю запятую
              sub(/,$/, "", pages)

              # Печать коммит-объекта
              if (!first) print ","
              first = 0

              print "  {"
              print "    \"date\": \"" escape(date) "\","
              print "    \"message\": \"" escape(msg) "\","
              print "    \"url\": \"https://github.com/" repo "/commit/" sha "\","
              print "    \"pages\": [" pages "]"
              print "  }"
            }

            END {
              print "]"
            }
          ' > website/src/data/git-commits-pages.json

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-commits-pages
          path: website/src/data/git-commits-pages.json








      - name: Build pages
        run: npm run build
        working-directory: website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
