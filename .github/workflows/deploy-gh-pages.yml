# Sample workflow for building and deploying a Docusaurus site to GitHub Pages
name: Publish website to GitHub Pages

on:
  #pull_request:
  #  branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      SHOW_GOOGLE_ADS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: website
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Prepare latest commits from git
        run: |
          mkdir -p website/src/data
          git log -n 20 --pretty=format:'%H@@@%ad@@@%s' --date=format:'%e %B %Y' | \
            awk -F'@@@' '!($3 ~ /^!/ || $3 ~ /https?:\/\//) {
              gsub(/"/, "\\\"", $3);
              print "{\"date\": \"" $2 "\", \"message\": \"" $3 "\", \"url\": \"https://github.com/'"${GITHUB_REPOSITORY}"'/commit/" $1 "\"}"
            }' | \
            head -n 6 | \
            awk 'NR==1{printf "["}{if(NR>1)printf ","} {printf "%s", $0} END{print "]"}' \
            > website/src/data/git-commits.json





      - name: 🧰 Build git-commits-pages.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p website/src/data
          echo "[" > website/src/data/git-commits-pages.json

          git log -n 20 --pretty=format:'%H@@@%ad@@@%s' --date=format:'%e %B %Y' | while IFS="@@@" read sha date msg; do
            if [[ "$msg" =~ ^! || "$msg" =~ http ]]; then continue; fi

            files=$(git show --name-only --pretty=format: "$sha" | grep -E '^docs/.*\.md$|^blog/.*\.md$' || true)

            if [[ -n "$files" ]]; then
              file_urls=$(echo "$files" | awk '
                {
                  fname=$0;
                  gsub(/\.md$/, "", fname);
                  if (fname ~ /^docs\//) {
                    sub(/^docs\//, "", fname);
                    print "\"https://awesomefactorio.yrfle.com/" fname "\""
                  } else if (fname ~ /^blog\//) {
                    print "\"https://awesomefactorio.yrfle.com/" fname "\""
                  }
                }' | paste -sd "," -)
            else
              file_urls=""
            fi

            safe_msg=$(echo "$msg" | sed 's/"/\\"/g')

            echo "  {" >> website/src/data/git-commits-pages.json
            echo "    \"date\": \"$date\"," >> website/src/data/git-commits-pages.json
            echo "    \"message\": \"$safe_msg\"," >> website/src/data/git-commits-pages.json
            echo "    \"pages\": [${file_urls}]," >> website/src/data/git-commits-pages.json
            echo "    \"url\": \"https://github.com/${GITHUB_REPOSITORY}/commit/${sha}\"" >> website/src/data/git-commits-pages.json
            echo "  }," >> website/src/data/git-commits-pages.json
          done

          sed -i '$ s/,$//' website/src/data/git-commits-pages.json
          echo "]" >> website/src/data/git-commits-pages.json


      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-commits-pages
          path: website/src/data/git-commits-pages.json








      - name: Build pages
        run: npm run build
        working-directory: website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
